services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appliance_doctor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appliance_doctor"]
      interval: 5s
      timeout: 3s
      retries: 10

  milvus:
    build:
      context: ./milvus
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - milvus_data:/milvus_data
    ports:
      - "19530:19530"

  redis:
    image: redis/redis-stack-server:latest
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/appliance_doctor
      MILVUS_URI: http://milvus:19530
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /app/data
      HF_ENDPOINT: https://hf-mirror.com
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started

  frontend:
    build:
      context: ./frontend/app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  milvus_data:
  redis_data:
